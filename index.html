<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TableFlip — drop in an ugly CSV, get a dashboard</title>
<style>
:root{--ink:#1a1d26;--mut:#5b6172;--bg:#f6f7fb;--card:#fff;--acc:#4f46e5;--ok:#16a34a;--warn:#d97706;--line:#e5e7f0}
*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 64px}
header h1{font-size:28px;margin:0 0 4px}header h1 .flip{color:var(--acc)}
.sub{color:var(--mut);margin:0 0 24px}
#drop{border:2px dashed #c7cbe0;border-radius:16px;background:var(--card);padding:48px 24px;text-align:center;cursor:pointer;transition:.2s}
#drop.over{border-color:var(--acc);background:#eef0ff}
#drop b{font-size:18px}.fixtures{margin:16px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fixtures button,.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:14px}
.fixtures button:hover,.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.privacy{font-size:13px;color:var(--mut)}
#preview,#dash{margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,20,60,.05)}
table.grid{border-collapse:collapse;width:100%;font-size:13px;display:block;overflow-x:auto}
table.grid th,table.grid td{border:1px solid var(--line);padding:6px 10px;text-align:left;white-space:nowrap}
table.grid th{background:#f0f1fa}
.badge{display:inline-block;font-size:11px;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle}
.badge.high{background:#dcfce7;color:#166534}.badge.medium{background:#fef3c7;color:#92400e}.badge.low{background:#f1f5f9;color:#64748b}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--mut);margin-top:4px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.charts{grid-template-columns:1fr}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#flip{animation:flipin .6s ease}
@keyframes flipin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.toolbar{display:flex;gap:10px;align-items:center;margin:0 0 16px;flex-wrap:wrap}
.note{font-size:13px;color:var(--mut)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header><h1><span class="flip">TableFlip</span></h1>
<p class="sub">Drop in an ugly CSV, get a polished dashboard. No chart authoring, no signup — your data never leaves this page.</p></header>

<div id="drop"><b>Drop a CSV here</b><p class="privacy">or click to choose a file · works fully offline</p></div>
<div class="fixtures"><span class="privacy">No CSV handy? Try a fixture:</span>
<button data-fx="shipments">shipments-ugly.csv</button>
<button data-fx="sales">sales-messy.csv</button>
<button data-fx="tickets">support-tickets.csv</button>
</div>

<div id="preview" class="hidden"></div>
<div id="dash" class="hidden"></div>
</div>
<script>
"use strict";
/* TableFlip core — also extracted by tests/run.js. No network calls anywhere. */
const TableFlip = (function(){
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

/* ---------- CSV parser (PAR-01 battery) ---------- */
function sniffDelimiter(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim()!=="").slice(0,5);
  let commas=0,semis=0;
  for(const l of lines){commas+=(l.match(/,/g)||[]).length;semis+=(l.match(/;/g)||[]).length;}
  return semis>commas?";":",";
}
function parseCSV(text){
  text=String(text).replace(/^\uFEFF/,"");
  if(!text.trim()) return {headers:[],rows:[]};
  const d=sniffDelimiter(text), rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===d){row.push(cur);cur="";}
      else if(c==="\r"){/* skip, handled with \n */}
      else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur="";}
      else cur+=c;
    }
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  const nonEmpty=rows.filter(r=>r.length>1||(r.length===1&&r[0].trim()!==""));
  if(!nonEmpty.length) return {headers:[],rows:[]};
  return {headers:nonEmpty[0], rows:nonEmpty.slice(1)};
}

/* ---------- Inference (INF-01) ---------- */
const DATE_RES=[/^\d{4}-\d{2}-\d{2}/,/^\d{1,2}\/\d{1,2}\/\d{2,4}/,/^\d{1,2}-[A-Za-z]{3}-\d{2,4}/,/^[A-Za-z]{3,9} \d{1,2},? \d{4}/];
function normHeader(h){return h.trim().toLowerCase().replace(/[^a-z0-9]+/g,"");}
function cellType(v){
  v=String(v).trim(); if(v===""||/^(n\/a|na|null|none|-)$/i.test(v)) return "empty";
  if(DATE_RES.some(re=>re.test(v))&&!isNaN(Date.parse(v))) return "date";
  if(/^\d[\d.]*,\d{1,2}$/.test(v)) return "number"; // European decimal, e.g. 1.234,56
  if(/^[$€£¥]?\s?-?\(?[\d,]+(\.\d+)?\)?\s?%?$/.test(v)&&/[\d]/.test(v)){
    if(/[$€£¥%]/.test(v)) return "money";
    const n=parseFloat(v.replace(/[$€£¥,%\s()]/g,""));
    if(!isNaN(n)) return "number";
  }
  return "text";
}
function inferColumns(table){
  const sampleN=Math.min(200,table.rows.length);
  return table.headers.map((h,ci)=>{
    const norm=normHeader(h), cells=[];
    for(let r=0;r<sampleN;r++){const v=(table.rows[r]||[])[ci]; if(v!==undefined) cells.push(v);}
    const nonEmpty=cells.filter(v=>String(v).trim()!=="");
    const counts={}; for(const v of nonEmpty){const t=cellType(v);counts[t]=(counts[t]||0)+1;}
    const n=nonEmpty.length||1;
    const frac=k=>(counts[k]||0)/n;
    let type="text";
    if(frac("date")>0.7) type="date";
    else if(frac("money")>0.5) type="money";
    else if(frac("money")+frac("number")>0.8) type="number";
    else{
      const distinct=new Set(nonEmpty.map(v=>String(v).trim().toLowerCase()));
      const avgLen=nonEmpty.reduce((a,v)=>a+String(v).length,0)/n;
      const singleLine=nonEmpty.every(v=>!/[\r\n]/.test(String(v)));
      if(n>0&&singleLine&&avgLen<=60&&distinct.size<=Math.min(20,Math.max(2,n*0.1))) type="category";
    }
    let role="ignore", conf="low"; // "couldn't infer" is a real outcome, not dead code
    const kw={date:["date","dt","ship","order","created","time"],money:["cost","price","amount","usd","eur","revenue","total"],number:["qty","quantity","count","units","num"],category:["status","type","region","category","priority","method"]};
    const hit=Object.keys(kw).some(k=>kw[k].some(w=>norm.includes(w)));
    if(type==="money"||type==="number"){role="measure";conf=hit?"high":"medium";}
    else if(type==="date"){role="dimension";conf=hit?"high":"medium";}
    else if(type==="category"){role="dimension";conf="medium";}
    else if(type==="text"){
      const distinct=new Set(nonEmpty.map(v=>String(v).trim()));
      if(n>5&&distinct.size>n*0.9){role="id";conf="medium";}
    }
    return {name:h,index:ci,type,role,confidence:conf};
  });
}
function badge(col){
  if(col.confidence==="low"||col.role==="ignore") return '<span class="badge low">couldn\u2019t infer</span>';
  return '<span class="badge '+col.confidence+'">'+escapeHtml(col.type)+" · "+col.confidence+" confidence</span>";
}

/* ---------- Aggregation + SVG charts ---------- */
function numVal(v){ if(v==null) return 0; let s=String(v).trim();
  if(/^\d[\d.]*,\d{1,2}$/.test(s)) s=s.replace(/\./g,"").replace(",","."); // European decimals
  const n=parseFloat(s.replace(/[$€£¥,%\s()]/g,"")); return isNaN(n)?0:n; }
function fmtNum(n,isMoney){
  const neg=n<0, a=Math.abs(n);
  const s=a>=1000?a.toLocaleString("en-US",{maximumFractionDigits:2}):String(Math.round(a*100)/100);
  return (neg?"-":"")+(isMoney?"$":"")+s;
}
function groupSum(rows,dimIdx,measIdx){
  const m=new Map();
  for(const r of rows){const k=String(r[dimIdx]??"(blank)").trim()||"(blank)"; m.set(k,(m.get(k)||0)+numVal(r[measIdx]));}
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
function barSVG(pairs,title){
  const W=460,H=260,pad=34, top=pairs.slice(0,8), max=Math.max(...top.map(p=>p[1]),1);
  const bw=(W-pad*2)/top.length;
  let bars=top.map((p,i)=>{
    const h=(H-pad*2)*(p[1]/max), x=pad+i*bw+4, y=H-pad-h;
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw-8).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4" fill="#4f46e5"><title>'+escapeHtml(p[0])+": "+escapeHtml(String(Math.round(p[1]*100)/100))+'</title></rect>'
      +'<text x="'+(x+bw/2-4).toFixed(1)+'" y="'+(H-pad+14)+'" font-size="10" fill="#5b6172" text-anchor="middle">'+escapeHtml(p[0].slice(0,12))+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+escapeHtml(title)+'">'
    +'<text x="'+pad+'" y="18" font-size="13" font-weight="600" fill="#1a1d26">'+escapeHtml(title)+'</text>'+bars+'</svg>';
}
function lineSVG(points,title){
  const W=460,H=260,pad=34, vals=points.map(p=>p[1]);
  const max=Math.max(...vals,1), min=Math.min(...vals,0);
  const X=i=>pad+i*(W-pad*2)/Math.max(points.length-1,1), Y=v=>H-pad-((v-min)/(max-min||1))*(H-pad*2);
  const d=points.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+escapeHtml(title)+'">'
    +'<text x="'+pad+'" y="18" font-size="13" font-weight="600" fill="#1a1d26">'+escapeHtml(title)+'</text>'
    +'<path d="'+d+'" fill="none" stroke="#4f46e5" stroke-width="2.5"/>'
    +points.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="3.5" fill="#4f46e5"><title>'+escapeHtml(p[0])+": "+escapeHtml(String(Math.round(p[1]*100)/100))+'</title></circle>').join("")
    +'</svg>';
}
function kpiCards(rows,measures){
  return measures.map(m=>{
    const vals=rows.map(r=>numVal(r[m.index])), sum=vals.reduce((a,b)=>a+b,0);
    const isMoney=m.type==="money";
    return '<div class="kpi"><div class="v">'+escapeHtml(fmtNum(sum,isMoney))+'</div><div class="l">Total '+escapeHtml(m.name)+'</div></div>'
      +'<div class="kpi"><div class="v">'+escapeHtml(fmtNum(vals.length?sum/vals.length:0,isMoney))+'</div><div class="l">Avg '+escapeHtml(m.name)+'</div></div>'
      +'<div class="kpi"><div class="v">'+rows.length.toLocaleString()+'</div><div class="l">Rows</div></div>';
  }).join("");
}

/* ---------- Dashboard + export ---------- */
function pickVisuals(table,columns){
  const measures=columns.filter(c=>c.role==="measure"&&c.confidence!=="low").slice(0,2);
  const dims=columns.filter(c=>c.role==="dimension");
  const dateDim=dims.find(c=>c.type==="date"), catDim=dims.find(c=>c.type==="category");
  return {measures,dateDim,catDim,chips:dims.filter(c=>c.type==="category").slice(0,4)};
}
function dashboardHTML(table,columns,filters){
  filters=filters||{};
  let rows=table.rows;
  const chips=pickVisuals(table,columns).chips;
  for(const c of chips){const v=filters[c.index]; if(v) rows=rows.filter(r=>String(r[c.index]).trim()===v);}
  const {measures,dateDim,catDim}=pickVisuals(table,columns);
  let h='<div class="toolbar"><button class="btn primary" id="exportBtn">Export report (.html)</button>'
    +'<span class="note">'+rows.length.toLocaleString()+' rows'+(Object.keys(filters).length?' · filtered':"")+'</span></div>';
  h+='<div class="kpis">'+kpiCards(rows,measures)+'</div>';
  h+='<div class="chips">'+chips.map(c=>{
    const vals=[...new Set(table.rows.map(r=>String(r[c.index]).trim()))].filter(Boolean).slice(0,12);
    return '<span class="note">'+escapeHtml(c.name)+':</span>'+vals.map(v=>'<button class="chip'+(filters[c.index]===v?" on":"")+'" data-col="'+c.index+'" data-val="'+escapeHtml(v)+'">'+escapeHtml(v)+'</button>').join("")+'<button class="chip" data-clear="'+c.index+'">clear</button>';
  }).join("")+'</div><div class="charts">';
  if(catDim&&measures[0]) h+='<div class="card">'+barSVG(groupSum(rows,catDim.index,measures[0].index),escapeHtml(measures[0].name)+" by "+escapeHtml(catDim.name))+'</div>';
  if(dateDim&&measures[0]){
    const pts=[...groupSum(rows,dateDim.index,measures[0].index)].sort((a,b)=>new Date(a[0])-new Date(b[0]));
    h+='<div class="card">'+lineSVG(pts,escapeHtml(measures[0].name)+" over time")+'</div>';
  }
  h+='</div>';
  return {html:h,rowCount:rows.length};
}
function exportReport(title,table,columns,filters,cssText,appJS){
  // XSS-01 choke point: every value below passes through escapeHtml at the boundary,
  // and the embedded JSON escapes "<" so a payload can never break out of the script block.
  const safeTitle=escapeHtml(title);
  const dataJson=JSON.stringify({headers:table.headers,rows:table.rows,columns:columns.map(c=>({name:c.name,index:c.index,type:c.type,role:c.role,confidence:c.confidence})),filters}).replace(/</g,"\\u003c");
  const boot="window.__TFDATA__="+dataJson+";\n"
    +"document.addEventListener('DOMContentLoaded',function(){"
    +"var d=window.__TFDATA__,t={headers:d.headers,rows:d.rows};"
    +"function render(){var r=TableFlip.dashboardHTML(t,d.columns,window.__TFF__||{});document.getElementById('dash').innerHTML=r.html;bind();}"
    +"window.__TFF__=d.filters||{};"
    +"function bind(){document.querySelectorAll('#dash .chip').forEach(function(ch){ch.onclick=function(){"
    +"var c=ch.getAttribute('data-clear');if(c!==null){delete window.__TFF__[c];}else{window.__TFF__[ch.getAttribute('data-col')]=ch.getAttribute('data-val');}render();};});"
    +"var ex=document.getElementById('exportBtn');if(ex)ex.style.display='none';}"
    +"render();});";
  return "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">"
    +"<title>"+safeTitle+" — TableFlip report</title><style>"+cssText+"</style></head>"
    +"<body><div class=\"wrap\"><header><h1>"+safeTitle+"</h1><p class=\"sub\">Generated by TableFlip · offline report</p></header>"
    +"<div id=\"dash\"></div></div><script>"+appJS+"\n"+boot+"</scr"+"ipt></body></html>";
}
return {escapeHtml,parseCSV,inferColumns,badge,numVal,fmtNum,groupSum,barSVG,lineSVG,kpiCards,pickVisuals,dashboardHTML,exportReport,normHeader};
})();
if(typeof module!=="undefined"&&module.exports) module.exports=TableFlip;
</script>

let TF={table:null,columns:[],filters:{},fileName:""};

function loadText(name,text){
  const t=TableFlip.parseCSV(text);
  if(!t.headers.length){alert("Couldn't find any data in that file.");return;}
  TF={table:t,columns:TableFlip.inferColumns(t),filters:{},fileName:name};
  renderPreview();
}
function renderPreview(){
  const t=TF.table, cols=TF.columns, N=Math.min(8,t.rows.length);
  let h='<div class="card"><h3 style="margin-top:0">'+TableFlip.escapeHtml(TF.fileName)+' <span class="note">'+t.rows.length.toLocaleString()+' rows × '+t.headers.length+' columns</span></h3>';
  h+='<table class="grid"><tr>'+t.headers.map((hh,i)=>'<th>'+TableFlip.escapeHtml(hh)+'<br>'+TableFlip.badge(cols[i])+'</th>').join("")+'</tr>';
  for(let r=0;r<N;r++) h+='<tr>'+t.headers.map((_,i)=>'<td>'+TableFlip.escapeHtml(String((t.rows[r]||[])[i]??""))+'</td>').join("")+'</tr>';
  h+='</table><p class="note">Showing first '+N+' rows. Column badges show what TableFlip inferred and how confident it is.</p>';
  h+='<button class="btn primary" id="flipBtn">Build dashboard →</button></div>';
  const p=$("#preview"); p.innerHTML=h; p.classList.remove("hidden");
  $("#flipBtn").onclick=()=>{const d=$("#dash");d.setAttribute("id","flip");d.setAttribute("id","dash");showDash();};
}
function showDash(){
  const r=TableFlip.dashboardHTML(TF.table,TF.columns,TF.filters);
  const d=$("#dash"); d.innerHTML=r.html; d.classList.remove("hidden");
  d.querySelectorAll(".chip").forEach(ch=>{ch.onclick=()=>{
    const c=ch.getAttribute("data-clear");
    if(c!==null) delete TF.filters[c]; else TF.filters[ch.getAttribute("data-col")]=ch.getAttribute("data-val");
    showDash();
  };});
  const ex=$("#exportBtn"); if(ex) ex.onclick=doExport;
  d.scrollIntoView({behavior:"smooth",block:"start"});
}
function doExport(){
  const css=document.querySelector("style").textContent;
  const appJS=document.querySelectorAll("script")[0].textContent;
  const html=TableFlip.exportReport(TF.fileName||"report",TF.table,TF.columns,TF.filters,css,appJS);
  const blob=new Blob([html],{type:"text/html"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="tableflip-report.html"; document.body.appendChild(a); a.click(); a.remove();
}
const drop=$("#drop");
drop.onclick=()=>{const i=document.createElement("input");i.type="file";i.accept=".csv,.txt";i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadText(f.name,r.result);r.readAsText(f);};i.click();};
["dragover","dragenter"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop",ev=>{const f=ev.dataTransfer.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadText(f.name,r.result);r.readAsText(f);});
document.querySelectorAll("[data-fx]").forEach(b=>{b.onclick=()=>{const k=b.getAttribute("data-fx");if(FIXTURES[k])loadText(k+".csv",FIXTURES[k]);};});
